name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"   # 매일 1회 실행 (UTC 18:00 = KST 03:00)
  workflow_dispatch:       # 수동 실행 가능
  push:
    paths:
      - '.github/workflows/profile-3d-contrib.yml'   # 이 워크플로우 수정 시 실행

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Update contribution count in README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          COUNT=$(gh api graphql -f owner="$OWNER" -f query='
            query($owner: String!) {
              user(login: $owner) {
                contributionsCollection {
                  contributionCalendar { totalContributions }
                }
              }
            }' --jq '.data.user.contributionsCollection.contributionCalendar.totalContributions') || true
          if ! echo "$COUNT" | grep -qE '^[0-9]+$'; then
            echo "::warning::Could not read contribution count; leaving README unchanged"
            exit 0
          fi
          FORMATTED=$(echo "$COUNT" | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/;ta')
          echo "Contributions in the last year: $FORMATTED"
          sed -i "s|^\*\*[0-9,]* contributions in the last year\*\*$|**${FORMATTED} contributions in the last year**|" README.md

      - name: Commit changes
        run: |
          git config --local user.email "dldnjsxkr852@naver.com"
          git config --local user.name "Anyangta"
          git add -A profile-3d-contrib README.md
          git commit -m "Update 3D contribution graph and contribution count" || echo "No changes to commit"
          git pull --rebase
          git push
