name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"   # 매일 1회 실행 (UTC 18:00 = KST 03:00)
  workflow_dispatch:       # 수동 실행 가능
  push:
    paths:
      - '.github/workflows/profile-3d-contrib.yml'   # 이 워크플로우 수정 시 실행

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Update commit hours in README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/commit_hours.py || echo "::warning::commit hours 갱신 실패, README 유지"

      - name: Commit changes
        run: |
          git config --local user.email "dldnjsxkr852@naver.com"
          git config --local user.name "Anyangta"
          git add -A profile-3d-contrib README.md
          git commit -m "Update 3D graph and commit hours" || echo "No changes to commit"
          git pull --rebase
          git push
